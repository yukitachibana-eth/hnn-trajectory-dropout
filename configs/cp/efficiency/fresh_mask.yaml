# Efficiency benchmark (fresh_mask): tiny geometry of Table 14 (2 control cells, 64 training ICs, batch 32).
# Real training epochs and a 60-step rollout of 16 ICs are timed; see hnnuq/eval/efficiency.py.
system_type: coupled_pendulum_mr
dataset_index: cpend_mr01_clean
run_index: efficiency_fresh_mask
seed: 42
n_samples: 64
n_val_samples: 16
n_test_samples: 32
k_samples: 2
k_val_samples: 2
k_test_samples: 2
model_type: MassRatioSimpleHNN
n_hidden: 500
nonlin: intsin2x
scale_weights: true
dropout_variant: mc_dropout
drop_prob: 0.1
mask_num: 100
finite_mask_mode: none
concrete_temp: 0.1
batch_size: 32
n_epochs: 600
lr: 0.001
weight_decay: 0.005
grad_clip: 1.0
scheduler_patience: 3
scheduler_factor: 0.7
batch_k_matrices: false
gradual_horizon_increase: false
early_stop_patience: 4
early_stop_min_epochs: 200
T: 10
T_val: 200
T_test: 200
dt: 0.1
T_init_seq: 10
use_leapfrog: true
val_use_all_masks: false
pred_samples: 10
test_freq: 10000
save_freq: 10000
compute_energy: false
compute_calibration: false
data_dir: data
